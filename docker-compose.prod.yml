# Producción Pilates Villa Crespo — convive con el stack de main en el mismo VPS.
#
# Traefik (traefik-traefik-1) escucha :80/:443 en el host.
# api/admin se publican solo en 127.0.0.1 (puertos 3111/3110, no 3001/3000 de main).
#
# Uso:
#   1. DNS A: pilatesvillacrespo.admin.atenzia.tech
#              pilatesvillacrespo.api.atenzia.tech
#              → IP pública del VPS
#   2. Completá .env.production (NO reutilices el de main)
#   3. docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# ARM (Ampere): WAHA_IMAGE=devlikeapro/waha:noweb-arm
# x86:          WAHA_IMAGE=devlikeapro/waha:noweb

name: pilates-villa-crespo-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pilatesvc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-agent_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: pilatesvc-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:noweb}
    container_name: pilatesvc-waha
    restart: unless-stopped
    environment:
      WHATSAPP_API_HOSTNAME: 0.0.0.0
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY in .env.production}
      WHATSAPP_HOOK_URL: http://api:3001/api/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message,message.any,message.ack,session.status
      WAHA_SESSION_CONFIG_IGNORE_STATUS: 'True'
      WAHA_SESSION_CONFIG_IGNORE_GROUPS: 'True'
      WAHA_SESSION_CONFIG_IGNORE_CHANNELS: 'True'
      WAHA_SESSION_CONFIG_IGNORE_BROADCAST: 'True'
      WAHA_PRINT_QR: 'False'
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?Set WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD:?Set WHATSAPP_SWAGGER_PASSWORD}
      WAHA_ZIPPED_SESSIONS: 'False'
    volumes:
      - waha_sessions:/app/.sessions
    dns:
      - 1.1.1.1
      - 8.8.8.8
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pilatesvc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      waha:
        condition: service_started
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_platform}?schema=public
      REDIS_URL: redis://redis:6379
      API_URL: ${API_URL:-https://pilatesvillacrespo.api.atenzia.tech}
      ADMIN_URL: ${ADMIN_URL:-https://pilatesvillacrespo.admin.atenzia.tech}
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_WEBHOOK_URL: http://api:3001/api/webhooks/waha
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://pilatesvillacrespo.api.atenzia.tech/api/oauth/google/callback}
      ZERNIO_REDIRECT_URI: ${ZERNIO_REDIRECT_URI:-https://pilatesvillacrespo.api.atenzia.tech/api/social/oauth/callback}
      VIDEO_EDITOR_FFMPEG_PATH: ffmpeg
      VIDEO_EDITOR_FFPROBE_PATH: ffprobe
      VIDEO_EDITOR_FONT_FILE: /usr/share/fonts/dejavu/DejaVuSans-Bold.ttf
    # 3111 = host; 3001 = puerto interno. Main usa 127.0.0.1:3001.
    ports:
      - '127.0.0.1:3111:3001'
    labels:
      - traefik.enable=true
      - traefik.http.routers.pilatesvc-api.rule=Host(`${API_HOST:-pilatesvillacrespo.api.atenzia.tech}`)
      - traefik.http.routers.pilatesvc-api.entrypoints=websecure
      - traefik.http.routers.pilatesvc-api.tls=true
      - traefik.http.routers.pilatesvc-api.tls.certresolver=letsencrypt
      - traefik.http.routers.pilatesvc-api.service=pilatesvc-api
      - traefik.http.services.pilatesvc-api.loadbalancer.server.port=3001
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://pilatesvillacrespo.api.atenzia.tech/api}
        NEXT_PUBLIC_ADMIN_EMAIL: ${NEXT_PUBLIC_ADMIN_EMAIL:-admin@negocio.local}
    container_name: pilatesvc-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:3110:3000'
    labels:
      - traefik.enable=true
      - traefik.http.routers.pilatesvc-admin.rule=Host(`${ADMIN_HOST:-pilatesvillacrespo.admin.atenzia.tech}`)
      - traefik.http.routers.pilatesvc-admin.entrypoints=websecure
      - traefik.http.routers.pilatesvc-admin.tls=true
      - traefik.http.routers.pilatesvc-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.pilatesvc-admin.service=pilatesvc-admin
      - traefik.http.services.pilatesvc-admin.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'

volumes:
  postgres_data:
  redis_data:
  waha_sessions:
